# Signal on Render: Postgres + FastAPI + Next.js
# Dashboard: New + Blueprint and point this file at your repo.

databases:
  - name: signal-db
    plan: free
    databaseName: signal
    user: signal

services:
  - type: web
    name: signal-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signal-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          name: signal-web
          type: web
          property: host
      - key: CORS_ORIGINS
        sync: false
        value: http://localhost:3000,http://127.0.0.1:3000
      - key: PYTHON_VERSION
        value: "3.12.8"

  - type: web
    name: signal-web
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: BACKEND_URL
        fromService:
          name: signal-api
          type: web
          property: host
